<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAV-SolarNet: High-Performance WebGIS Dashboard</title>
    
    <!-- MapLibre GL JS CDN -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: rgba(15, 23, 42, 0.93);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #f97316;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #map {
            flex-grow: 1;
            height: 100%;
            position: relative;
        }

        /* Sidebar styling */
        .sidebar {
            width: 380px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border-color);
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 10;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            flex-shrink: 0;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .control-group {
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px;
        }

        .control-group h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .toggle-btn-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 2px;
            margin-bottom: 8px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
        }

        /* Stats Panel */
        .stats-panel {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .stat-card .val {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        .stat-card .val span {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Map Legend Overlay */
        .legend-overlay {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            min-width: 200px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            pointer-events: none;
        }

        .legend-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 0.8rem;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* Tooltip Popup */
        .maplibregl-popup-content {
            background: rgba(15, 23, 42, 0.94) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 12px !important;
            color: #f8fafc !important;
            padding: 16px !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6) !important;
            font-family: 'Inter', sans-serif !important;
        }
        
        .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: rgba(15, 23, 42, 0.94) !important; }
        .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: rgba(15, 23, 42, 0.94) !important; }
        
        .custom-popup {
            min-width: 220px;
        }
        .pop-title {
            font-size: 0.95rem;
            font-weight: 800;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pop-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-bottom: 4px;
        }
        .pop-label { color: var(--text-muted); }
        .pop-val { font-weight: 600; color: #fff; }
    </style>
</head>
<body>

    <!-- SIDEBAR PANEL -->
    <div class="sidebar">
        <div class="header">
            <h1>🗺️ UAV-<span>SolarNet</span></h1>
            <p>Den Chai Municipal WebGIS Dashboard</p>
        </div>

        <!-- View Mode Selector -->
        <div class="control-group">
            <h3>📐 View Mode</h3>
            <div class="toggle-btn-container">
                <button id="btn-facets" class="toggle-btn active" onclick="setViewMode('facets')">Roof Facets</button>
                <button id="btn-buildings" class="toggle-btn" onclick="setViewMode('buildings')">Buildings</button>
            </div>
        </div>

        <!-- Color Mode Selector -->
        <div class="control-group" id="color-mode-group">
            <h3>🎨 Color Styling</h3>
            <div class="toggle-btn-container">
                <button id="btn-color-class" class="toggle-btn active" onclick="setColorMode('class')">Classes</button>
                <button id="btn-color-energy" class="toggle-btn" onclick="setColorMode('energy')">Solar Potential</button>
            </div>
        </div>

        <!-- Stats summary panel -->
        <div class="stats-panel">
            <div class="stat-card">
                <div class="label">Total Solar Capacity</div>
                <div class="val" id="stat-capacity">0.00 <span>MWp</span></div>
            </div>
            <div class="stat-card">
                <div class="label">Annual Energy Potential</div>
                <div class="val" id="stat-energy">0.00 <span>GWh/y</span></div>
            </div>
            <div class="stat-card">
                <div class="label">Total Structures</div>
                <div class="val" id="stat-structures" style="font-size: 1.25rem;">0 <span>units</span></div>
            </div>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map">
        <!-- Legend Panel Overlay -->
        <div class="legend-overlay" id="legend">
            <div class="legend-title" id="legend-title">Aspect Classes</div>
            <div id="legend-items"></div>
        </div>
    </div>

    <script>
        // 1. Initial State config
        let viewMode = 'facets';   // 'facets' or 'buildings'
        let colorMode = 'class';   // 'class' or 'energy'

        // Class colors matching paper definitions
        const CLASS_LEGEND = [
            { color: '#ff0000', label: 'N-Roof (Red)' },
            { color: '#00ff00', label: 'E-Roof (Green)' },
            { color: '#0000ff', label: 'S-Roof (Blue)' },
            { color: '#ffff00', label: 'W-Roof (Yellow)' },
            { color: '#ff00ff', label: 'Flat Roof (Magenta)' },
            { color: '#808000', label: 'U-Roof (Olive)' },
            { color: '#8000ff', label: 'PV Panel (Violet/Purple)' }
        ];

        const ENERGY_LEGEND = [
            { color: '#22c55e', label: '< 5 kWp (Green / Low)' },
            { color: '#f97316', label: '≥ 5 kWp (Orange / High)' },
            { color: '#000000', label: 'U-Roof (Black / N/A)' }
        ];

        // 2. Setup MapLibre GL Map centered on Den Chai
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
            center: [100.0548, 17.9824], 
            zoom: 16,
            minZoom: 12,
            maxZoom: 20
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');

        // 3. Load GeoJSON layers
        map.on('load', () => {
            // Add Facets source
            map.addSource('facets-src', {
                type: 'geojson',
                data: './public/rooftop_facets.geojson'
            });

            // Add Buildings source
            map.addSource('buildings-src', {
                type: 'geojson',
                data: './public/buildings.geojson'
            });

            // Layer A: Roof Facet polygons
            map.addLayer({
                id: 'facets-fill',
                type: 'fill',
                source: 'facets-src',
                layout: { 'visibility': 'visible' },
                paint: {
                    'fill-color': ['get', 'color'], // Default to class colors Hex
                    'fill-opacity': 0.82,
                    'fill-outline-color': 'rgba(255, 255, 255, 0.15)'
                }
            });

            // Layer B: Whole Building footprints
            map.addLayer({
                id: 'buildings-fill',
                type: 'fill',
                source: 'buildings-src',
                layout: { 'visibility': 'none' },
                paint: {
                    'fill-color': ['get', 'energy_color'], // Default to capacity heatmap
                    'fill-opacity': 0.88,
                    'fill-outline-color': 'rgba(255, 255, 255, 0.2)'
                }
            });

            // Add popup handlers
            setupPopups();

            // Calculate total summaries dynamically on load
            calculateSummaries();
        });

        // 4. GUI Toggles
        function setViewMode(mode) {
            viewMode = mode;
            document.getElementById('btn-facets').classList.toggle('active', mode === 'facets');
            document.getElementById('btn-buildings').classList.toggle('active', mode === 'buildings');

            // Hide/Show layers
            map.setLayoutProperty('facets-fill', 'visibility', mode === 'facets' ? 'visible' : 'none');
            map.setLayoutProperty('buildings-fill', 'visibility', mode === 'buildings' ? 'visible' : 'none');

            // Show/Hide color mode options (since buildings only use capacity coloring)
            const colorGroup = document.getElementById('color-mode-group');
            if (mode === 'buildings') {
                colorGroup.style.display = 'none';
            } else {
                colorGroup.style.display = 'block';
            }

            updateLegend();
            calculateSummaries();
        }

        function setColorMode(mode) {
            colorMode = mode;
            document.getElementById('btn-color-class').classList.toggle('active', mode === 'class');
            document.getElementById('btn-color-energy').classList.toggle('active', mode === 'energy');

            // Change paint property dynamically
            if (mode === 'class') {
                map.setPaintProperty('facets-fill', 'fill-color', ['get', 'color']);
            } else {
                map.setPaintProperty('facets-fill', 'fill-color', ['get', 'energy_color']);
            }

            updateLegend();
        }

        // 5. Update legend overlay
        function updateLegend() {
            const titleEl = document.getElementById('legend-title');
            const itemsEl = document.getElementById('legend-items');
            itemsEl.innerHTML = '';

            let items = [];
            if (viewMode === 'buildings') {
                titleEl.innerText = 'System Capacity';
                items = ENERGY_LEGEND.slice(0, 2); // Only Green & Orange for buildings
            } else {
                if (colorMode === 'class') {
                    titleEl.innerText = 'Aspect Classes';
                    items = CLASS_LEGEND;
                } else {
                    titleEl.innerText = 'Solar Potential';
                    items = ENERGY_LEGEND;
                }
            }

            items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'legend-item';
                row.innerHTML = `
                    <div class="legend-color" style="background: ${item.color}"></div>
                    <span style="color: #cbd5e1">${item.label}</span>
                `;
                itemsEl.appendChild(row);
            });
        }
        
        // Run once on start
        updateLegend();

        // 6. Dynamic calculations for statistics
        function calculateSummaries() {
            const srcId = viewMode === 'facets' ? 'facets-src' : 'buildings-src';
            const source = map.getSource(srcId);
            if (!source) return;

            // Wait for data load
            const data = source._data;
            if (!data || !data.features) return;

            let totalCapacity = 0;
            let totalEnergy = 0;
            let count = data.features.length;

            data.features.forEach(f => {
                const p = f.properties;
                totalCapacity += p.capacity_kwp || 0;
                totalEnergy += p.energy_corrected_kwh || p.energy_kwh || 0;
            });

            document.getElementById('stat-capacity').innerHTML = `${(totalCapacity / 1000).toFixed(2)} <span>MWp</span>`;
            document.getElementById('stat-energy').innerHTML = `${(totalEnergy / 1000000).toFixed(2)} <span>GWh/y</span>`;
            document.getElementById('stat-structures').innerHTML = `${new Intl.NumberFormat('en-US').format(count)} <span>${viewMode}</span>`;
        }

        // Trigger summary recalculation when source data is fully loaded
        map.on('sourcedata', (e) => {
            if (e.isSourceLoaded) {
                calculateSummaries();
            }
        });

        // 7. Interactive Tooltip Popups on Click
        function setupPopups() {
            const popup = new maplibregl.Popup({
                closeButton: false,
                closeOnClick: true
            });

            // Facet Click
            map.on('click', 'facets-fill', (e) => {
                const feat = e.features[0];
                const p = feat.properties;
                const corrPct = Math.round((p.solar_correction || 1) * 100);
                
                const html = `
                    <div class="custom-popup">
                        <div class="pop-title">
                            <div style="width:10px;height:10px;border-radius:2px;background:${p.color || '#fff'}"></div>
                            ${p.class_name || 'Rooftop'}
                        </div>
                        <div class="pop-row"><span class="pop-label">2D Footprint</span><span class="pop-val">${p.area_2d} m²</span></div>
                        <div class="pop-row"><span class="pop-label">3D Area (Slope)</span><span class="pop-val">${p.area_3d} m²</span></div>
                        <div class="pop-row"><span class="pop-label">Slope Angle</span><span class="pop-val">${p.slope_deg}°</span></div>
                        <div class="pop-row"><span class="pop-label">Aspect Angle</span><span class="pop-val">${p.aspect_deg}°</span></div>
                        <div class="pop-row" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);">
                            <span class="pop-label" style="color:#fbbf24">⚡ Capacity Size</span>
                            <span class="pop-val" style="color:#fcd34d">${p.capacity_kwp} kWp</span>
                        </div>
                        <div class="pop-row"><span class="pop-label">🌞 Solar Factor</span><span class="pop-val">${corrPct}%</span></div>
                        <div class="pop-row"><span class="pop-label" style="color:#6ee7b7">☀️ Corrected Yield</span><span class="pop-val" style="color:#34d399">${new Intl.NumberFormat('en-US').format(Math.round(p.energy_corrected_kwh || p.energy_kwh))} kWh/y</span></div>
                        <div class="pop-row"><span class="pop-label" style="color:#93c5fd">💰 Est. Savings</span><span class="pop-val" style="color:#60a5fa">${new Intl.NumberFormat('en-US').format(Math.round(p.savings_thb))} ฿/y</span></div>
                    </div>
                `;
                
                popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
            });

            // Building Click
            map.on('click', 'buildings-fill', (e) => {
                const feat = e.features[0];
                const p = feat.properties;
                const sav = p.savings_thb ?? 0;
                
                const html = `
                    <div class="custom-popup">
                        <div class="pop-title">
                            <div style="width:10px;height:10px;border-radius:2px;background:${p.energy_color || '#fff'}"></div>
                            ${p.building_id || 'Building Footprint'}
                        </div>
                        <div class="pop-row"><span class="pop-label">Total 2D Area</span><span class="pop-val">${p.area_2d} m²</span></div>
                        <div class="pop-row"><span class="pop-label">Total 3D Area</span><span class="pop-val">${p.area_3d} m²</span></div>
                        <div class="pop-row" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.08);">
                            <span class="pop-label" style="color:#fbbf24">⚡ Combined Capacity</span>
                            <span class="pop-val" style="color:#fcd34d">${p.capacity_kwp} kWp</span>
                        </div>
                        <div class="pop-row"><span class="pop-label" style="color:#6ee7b7">☀️ Total Solar Yield</span><span class="pop-val" style="color:#34d399">${new Intl.NumberFormat('en-US').format(Math.round(p.energy_corrected_kwh || p.energy_kwh))} kWh/y</span></div>
                        <div class="pop-row"><span class="pop-label" style="color:#93c5fd">💰 Est. Savings</span><span class="pop-val" style="color:#60a5fa">${new Intl.NumberFormat('en-US').format(Math.round(sav))} ฿/y</span></div>
                    </div>
                `;
                
                popup.setLngLat(e.lngLat).setHTML(html).addTo(map);
            });

            // Hover cursor styles
            map.on('mouseenter', 'facets-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'facets-fill', () => { map.getCanvas().style.cursor = ''; });
            map.on('mouseenter', 'buildings-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', 'buildings-fill', () => { map.getCanvas().style.cursor = ''; });
        }
    </script>
</body>
</html>
