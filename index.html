<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบสารสนเทศภูมิศาสตร์ | เทศบาลตำบลเด่นชัย</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- ฟอนต์ไทย -->
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --brand: #2c5f2d;
    --brand-dark: #1f4620;
    --brand-light: #eaf3ea;
    --accent: #e63946;
    --border: #dcdcdc;
    --text: #22291f;
    --muted: #6b7268;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Sarabun', sans-serif; }

  html, body { height: 100%; }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ===== Navbar ===== */
  .navbar {
    height: 56px;
    min-height: 56px;
    background: var(--brand);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    gap: 12px;
    z-index: 1100;
  }

  .navbar h1 {
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .navbar .subtitle {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    display: none;
  }

  #sidebar-toggle {
    display: none;
    background: rgba(255,255,255,0.15);
    border: none;
    color: #fff;
    width: 34px;
    height: 34px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  /* ===== Layout ===== */
  main {
    position: relative;
    flex: 1;
    display: flex;
    min-height: 0;
  }

  #map { flex: 1; height: 100%; }

  /* ===== Search box (overlay on map) ===== */
  .search-box {
    position: absolute;
    top: 14px;
    left: 60px;
    z-index: 1000;
    background: #fff;
    padding: 8px;
    border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
    display: flex;
    gap: 6px;
  }

  .search-box input {
    width: 220px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
  }

  .search-box input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }

  .search-box button {
    padding: 7px 14px;
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s ease;
  }

  .search-box button:hover { background: var(--brand-dark); }
  .search-box button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ===== Sidebar (feature list) ===== */
  #sidebar {
    width: 280px;
    background: #fff;
    border-left: 1px solid var(--border);
    padding: 14px;
    overflow-y: auto;
  }

  #sidebar h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--brand-dark);
    margin-bottom: 10px;
  }

  #feature-list { list-style: none; }

  #feature-list li {
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  #feature-list li:hover,
  #feature-list li:focus-visible {
    background: var(--brand-light);
    border-color: var(--brand);
  }

  #feature-list li .item-title {
    display: block;
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
  }

  #feature-list li .item-desc {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  #feature-list .empty {
    font-size: 13px;
    color: var(--muted);
    cursor: default;
    border-style: dashed;
  }

  /* ===== Popup ภาษาไทย ===== */
  .leaflet-popup-content { font-family: 'Sarabun', sans-serif; font-size: 13.5px; }
  .leaflet-popup-content b { color: var(--brand-dark); }

  /* ===== Responsive (มือถือ) ===== */
  @media (max-width: 720px) {
    .navbar h1 { font-size: 15px; }
    #sidebar-toggle { display: inline-block; }

    .search-box {
      left: 12px;
      right: 12px;
      top: 12px;
    }
    .search-box input { width: 100%; }

    main { flex-direction: column; }

    #sidebar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-height: 45%;
      border-left: none;
      border-top: 1px solid var(--border);
      transform: translateY(100%);
      transition: transform 0.2s ease;
      z-index: 1050;
    }

    #sidebar.open { transform: translateY(0); }
  }
</style>
</head>
<body>
<div id="app">

  <div class="navbar">
    <h1>📍 GIS เทศบาลตำบลเด่นชัย จังหวัดแพร่</h1>
    <button id="sidebar-toggle" aria-label="เปิด/ปิดรายการข้อมูล" aria-expanded="false">☰</button>
  </div>

  <main>
    <div id="map">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ค้นหา... เช่น ชื่อพื้นที่" aria-label="ค้นหาพื้นที่">
        <button id="searchBtn">ค้นหา</button>
      </div>
    </div>

    <aside id="sidebar">
      <h2>รายการพื้นที่</h2>
      <ul id="feature-list"></ul>
    </aside>
  </main>

</div>

<script>
  // ===== 1. สร้างแผนที่ center ที่ ต.เด่นชัย อ.เด่นชัย จ.แพร่ =====
  const map = L.map('map', { zoomControl: true }).setView([17.986, 100.055], 14);

  // ===== 2. Basemap =====
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const satellite = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { attribution: '&copy; Esri', maxZoom: 19 }
  );

  L.control.layers(
    { 'แผนที่ปกติ': osm, 'ภาพถ่ายดาวเทียม': satellite },
    {},
    { position: 'topright' }
  ).addTo(map);

  // ===== 3. โหลดขอบเขตเทศบาลจริงจากไฟล์ data/denchai_admin.geojson =====
  const featureListEl = document.getElementById('feature-list');
  let municipalityLayer;

  // ดึงชื่อพื้นที่จาก properties โดยรองรับหลายชื่อคีย์ที่พบได้บ่อยในข้อมูล GIS ของไทย
  function getFeatureName(props) {
    return props.boundaryor || props.name || props.NAME || props.ADM_NAME || 'ไม่ระบุชื่อ';
  }

  fetch('data/denchai_admin.geojson')
    .then((res) => {
      if (!res.ok) throw new Error('โหลดไฟล์ขอบเขตเทศบาลไม่สำเร็จ (' + res.status + ')');
      return res.json();
    })
    .then((data) => {
      municipalityLayer = L.geoJSON(data, {
        style: { color: '#e63946', weight: 2, fillOpacity: 0.15 },
        onEachFeature: (feature, layer) => {
          const name = getFeatureName(feature.properties);
          layer.bindPopup(`<b>${name}</b>`);

          // เพิ่มรายการลง sidebar
          const li = document.createElement('li');
          li.tabIndex = 0;
          li.innerHTML = `<span class="item-title">${name}</span>`;
          const focusFeature = () => {
            map.fitBounds(layer.getBounds());
            layer.openPopup();
          };
          li.addEventListener('click', focusFeature);
          li.addEventListener('keyup', (e) => e.key === 'Enter' && focusFeature());
          featureListEl.appendChild(li);
        }
      }).addTo(map);

      // ปรับมุมมองแผนที่ให้พอดีกับขอบเขตที่โหลดมา
      if (municipalityLayer.getBounds().isValid()) {
        map.fitBounds(municipalityLayer.getBounds(), { padding: [20, 20] });
      }
    })
    .catch((err) => {
      console.error(err);
      featureListEl.innerHTML = `<li class="empty">โหลดข้อมูลขอบเขตไม่สำเร็จ: ${err.message}</li>`;
    });

  // ===== 4. ฟังก์ชันค้นหา (แก้ไข syntax error จากต้นฉบับแล้ว) =====
  function searchLayer() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;

    if (!municipalityLayer) {
      alert('ข้อมูลพื้นที่ยังโหลดไม่เสร็จ กรุณารอสักครู่');
      return;
    }

    let found = false;
    municipalityLayer.eachLayer(l => {
      const name = getFeatureName(l.feature.properties);
      if (name.includes(q)) {
        l.setStyle({ fillOpacity: 0.45 });
        map.fitBounds(l.getBounds());
        l.openPopup();
        found = true;
        setTimeout(() => l.setStyle({ fillOpacity: 0.15 }), 4000);
      }
    });

    if (!found) alert('ไม่พบข้อมูล: ' + q);
  }

  document.getElementById('searchBtn').addEventListener('click', searchLayer);
  document.getElementById('searchInput')
    .addEventListener('keyup', e => e.key === 'Enter' && searchLayer());

  // ===== 5. Sidebar toggle (สำหรับหน้าจอมือถือ) =====
  const sidebar = document.getElementById('sidebar');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  sidebarToggle.addEventListener('click', () => {
    const isOpen = sidebar.classList.toggle('open');
    sidebarToggle.setAttribute('aria-expanded', isOpen);
  });

  // ===== 6. เพิ่มเลเยอร์ข้อมูลอื่นในอนาคต (ตัวอย่าง) =====
  // fetch('data/schools.geojson')
  //   .then(r => r.json())
  //   .then(data => L.geoJSON(data, { pointToLayer: ..., onEachFeature: ... }).addTo(map));
</script>
</body>
</html>
